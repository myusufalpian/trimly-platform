name: CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: trimly
          POSTGRES_PASSWORD: trimlysecret
          POSTGRES_DB: trimly_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit & Integration Tests
        env:
          DATABASE_URL: postgres://trimly:trimlysecret@localhost:5432/trimly_db?sslmode=disable
        run: go test -v -race ./...

      - name: Build API Binary
        run: go build -o bin/api cmd/api/main.go
