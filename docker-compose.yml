version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trimly-postgres
    environment:
      POSTGRES_USER: trimly_user
      POSTGRES_PASSWORD: trimly_password
      POSTGRES_DB: trimly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimly_user -d trimly_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: trimly-mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

volumes:
  postgres_data:
